# Local patch: the `ask` tool parks an MCP tool call while a human decides.
# claude-cli's MCP idle timer is 5min for HTTP transports (30min only for stdio);
# the total-call deadline is ~27.8h, so idle is the only real limit. Raise it
# above the ask ceiling (10min) so a question can never die of idleness.
[Service]
Environment=CLAUDE_CODE_MCP_TOOL_IDLE_TIMEOUT=900000
