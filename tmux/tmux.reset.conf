# Keybindings: tmux defaults, plus vi-flavoured additions.
# Anything that shadowed a well-known default has been put back.

# Prefix C-a. C-a C-a sends a literal C-a on to the shell/nvim.
set -g prefix ^A
bind ^A send-prefix
bind Tab last-window

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# c / x / & keep their default meanings. (c used to be kill-pane.)
bind c new-window -c "#{pane_current_path}"
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind d detach

# Splits open in the current directory; % and " still work as usual.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Prefixed pane navigation, kept as a fallback. The one you'll actually use is
# C-h/j/k/l with no prefix, via vim-tmux-navigator.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize: hold the key down after the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim-tmux-navigator takes C-l at the root level, so clear-screen needs a home.
bind C-l send-keys 'C-l'

bind S setw synchronize-panes
bind P set pane-border-status

# Copy mode: v selects, y yanks (tmux-yank pushes it to the system clipboard).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
