[Service]
# Flash attention is required for a quantized KV cache.
Environment="OLLAMA_FLASH_ATTENTION=1"
# q8_0 roughly halves KV cache VRAM, which is what makes 32k context
# affordable on a 6GB card instead of evicting model layers to CPU.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# opencode's docs: below ~16k, agentic tool calls degrade.
Environment="OLLAMA_CONTEXT_LENGTH=32768"
